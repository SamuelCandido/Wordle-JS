<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Wordle Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Wordle</h1>
        <div id="wordle-board"></div>
        <div class="actions">
            <button id="submit-btn" type="button">Tentar</button>
            <button id="reset-btn" type="button" onclick="location.reload()">Reiniciar</button>
        </div>
        <div id="message"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
